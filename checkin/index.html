<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Guest check-in · MAAVU by Third Space</title>
<link rel="icon" href="../third_space_logo.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" />
<style>
  :root { --bg:#eeebe6; --ink:#2b2b2b; --ink2:#5e5a55; --acc:#9a5434; --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost","Helvetica Neue",Arial,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:300 17px/1.6 var(--sans); }
  main { max-width:680px; margin:0 auto; padding:32px 20px 64px; }
  .logo { display:block; width:72px; margin-bottom:28px; }
  .eyebrow { font:400 12px/1.4 var(--sans); letter-spacing:.3em; text-transform:uppercase; color:var(--acc); margin:0 0 14px; }
  h1 { font:300 clamp(34px,7vw,52px)/1.1 var(--serif); margin:0 0 14px; }
  h1 em { font-style:italic; }
  p.lead { color:var(--ink2); margin:0 0 24px; }
  .formwrap { background:#fff; padding:20px 16px; }
  .fallback { font-size:15px; color:var(--ink2); margin-top:20px; }
  .fallback a { color:var(--acc); }
</style>
</head>
<body>
<main>
  <img class="logo" src="../third_space_logo.png" alt="Third Space" />
  <p class="eyebrow">MAAVU · Guest check-in</p>
  <h1>Welcome. <em>A few details before you arrive.</em></h1>
  <p class="lead">Please fill this in before check-in. We need a photo ID for every adult guest, as required for the guest register.</p>
  <div class="formwrap">
    <iframe data-tally-src="https://tally.so/embed/7XKRDL?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="900" frameborder="0" marginheight="0" marginwidth="0" title="MAAVU Check-in"></iframe>
  </div>
  <p class="fallback">Form not loading? <a href="https://tally.so/r/7XKRDL">Open it here</a>, or send your ID on WhatsApp to +91 80880 03883.</p>
</main>
<script>
var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}
</script>
</body>
</html>
