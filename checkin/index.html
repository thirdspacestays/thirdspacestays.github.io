<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Guest check-in · MAAVU by Third Space</title>
<link rel="icon" href="../third_space_logo.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" />
<style>
  :root { --bg:#eeebe6; --ink:#2b2b2b; --ink2:#5e5a55; --acc:#9a5434; --line:rgb(43 43 43 / .14); --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost","Helvetica Neue",Arial,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:300 17px/1.6 var(--sans); }
  main { max-width:680px; margin:0 auto; padding:32px 20px 64px; }
  .logo { display:block; width:72px; margin-bottom:28px; }
  .eyebrow { font:400 12px/1.4 var(--sans); letter-spacing:.3em; text-transform:uppercase; color:var(--acc); margin:0 0 14px; }
  h1 { font:300 clamp(34px,7vw,52px)/1.1 var(--serif); margin:0 0 14px; }
  h1 em { font-style:italic; }
  p.lead { color:var(--ink2); margin:0 0 32px; }
  fieldset { border:0; border-top:1px solid var(--line); margin:0 0 28px; padding:24px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  legend { font:400 22px/1.2 var(--serif); padding:0; margin-bottom:6px; }
  label { display:grid; gap:6px; font:400 12px/1.4 var(--sans); letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); }
  input, select { font:300 17px/1.4 var(--sans); color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:0; padding:10px 12px; min-height:44px; width:100%; }
  input[type=file] { padding:8px; font-size:15px; }
  input:focus, select:focus { outline:2px solid var(--acc); outline-offset:1px; }
  .wide { grid-column:1 / -1; }
  .hint { font:300 14px/1.5 var(--sans); letter-spacing:0; text-transform:none; color:var(--ink2); margin:0; }
  .btn { font:400 13px/1 var(--sans); letter-spacing:.18em; text-transform:uppercase; background:var(--acc); color:#fff; border:1px solid var(--acc); padding:16px 28px; cursor:pointer; }
  .btn:disabled { opacity:.6; cursor:default; }
  .btn--ghost { background:transparent; color:var(--ink); border-color:var(--ink); }
  .err { color:var(--acc); font-size:15px; margin:0 0 16px; }
  .ok { background:#fff; border-left:3px solid var(--acc); padding:16px 18px; font-size:17px; }
  .foreign { display:none; }
  .is-foreign .foreign { display:grid; }
  .is-foreign .indian { display:none; }
  @media (max-width:560px) { fieldset { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="../third_space_logo.png" alt="Third Space" />
  <p class="eyebrow">MAAVU · Guest check-in</p>
  <h1>Welcome. <em>A few details before you arrive.</em></h1>
  <p class="lead">Please fill this in before check-in. We need an ID for every adult, as required for the guest register. Your details are kept private to the MAAVU hosts.</p>

  <form id="f" novalidate>
    <fieldset>
      <legend class="wide">Your booking</legend>
      <label class="wide">Name on the booking<input name="bookingName" required autocomplete="name" /></label>
      <label>Phone (WhatsApp)<input name="phone" type="tel" required autocomplete="tel" /></label>
      <label>Booked on<select name="platform"><option>Airbnb</option><option>Agoda</option><option>Direct (website / WhatsApp)</option></select></label>
      <label>Check-in date<input name="checkIn" type="date" required /></label>
      <label>Check-out date<input name="checkOut" type="date" required /></label>
      <label>Expected arrival time<input name="arrival" type="time" /></label>
      <label>Number of guests<select name="count" id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
    </fieldset>
    <div id="guests"></div>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn" type="submit" id="go">Submit check-in</button>
  </form>
  <div class="ok" id="ok" hidden></div>
</main>

<template id="tpl">
  <fieldset class="g">
    <legend class="wide">Guest <span class="n"></span></legend>
    <label class="wide">Full name (as on ID)<input data-k="name" required /></label>
    <label class="wide">Nationality<select data-k="nat"><option value="Indian">Indian</option><option value="Foreign">Foreign national</option></select></label>
    <label class="wide indian">Aadhaar card, front<input data-k="front" type="file" accept="image/*" /></label>
    <label class="wide indian">Aadhaar card, back<input data-k="back" type="file" accept="image/*" /></label>
    <label class="foreign">Country<input data-k="country" /></label>
    <label class="foreign">Passport number<input data-k="passport" /></label>
    <label class="foreign">Visa number<input data-k="visa" /></label>
    <label class="foreign">Visa valid until<input data-k="visaExp" type="date" /></label>
    <label class="foreign">Date of arrival in India<input data-k="arrIndia" type="date" /></label>
    <label class="foreign">Next destination<input data-k="nextDest" /></label>
    <label class="wide foreign">Passport photo page<input data-k="pp" type="file" accept="image/*" /></label>
    <label class="wide foreign">Visa page<input data-k="vp" type="file" accept="image/*" /></label>
    <p class="hint wide">Children under 18 don't need an ID; just add their name.</p>
    <label class="wide"><span><input data-k="minor" type="checkbox" style="width:auto;min-height:0;margin-right:8px;vertical-align:middle" />This guest is under 18</span></label>
  </fieldset>
</template>

<script>
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbzYxkltDZ3kDjYX_MPJC4YIu4QuOkMqzTJVCxcESvx1zL0jZ13O8As6eYm66I0_LpNbSA/exec";
  var wrap = document.getElementById("guests"), tpl = document.getElementById("tpl"), countSel = document.getElementById("count");
  function render() {
    var n = Number(countSel.value), have = wrap.children.length;
    for (var i = have; i < n; i++) {
      var node = tpl.content.firstElementChild.cloneNode(true);
      node.querySelector(".n").textContent = i + 1;
      node.querySelector('[data-k="nat"]').addEventListener("change", function (e) { e.target.closest(".g").classList.toggle("is-foreign", e.target.value === "Foreign"); });
      wrap.appendChild(node);
    }
    while (wrap.children.length > n) wrap.removeChild(wrap.lastElementChild);
  }
  countSel.addEventListener("change", render); render();

  function shrink(file) {
    return new Promise(function (res, rej) {
      if (!file) return res("");
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1800, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82).split(",")[1]);
      };
      img.onerror = function () { rej(new Error("img")); };
      img.src = url;
    });
  }

  var f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  function fail(m) { err.textContent = m; err.hidden = false; go.disabled = false; go.textContent = "Submit check-in"; }
  f.addEventListener("submit", function (e) {
    e.preventDefault(); err.hidden = true;
    var v = function (n) { return (f.elements[n].value || "").trim(); };
    if (!v("bookingName") || !v("phone") || !v("checkIn") || !v("checkOut")) return fail("Please fill in your booking name, phone and dates.");
    var gs = [].slice.call(wrap.querySelectorAll(".g")), jobs = [], body = new URLSearchParams();
    body.append("action", "checkin");
    ["bookingName", "phone", "platform", "checkIn", "checkOut", "arrival"].forEach(function (n) { body.append(n, v(n)); });
    body.append("count", gs.length);
    for (var i = 0; i < gs.length; i++) {
      var g = gs[i], q = function (k) { return g.querySelector('[data-k="' + k + '"]'); };
      var name = q("name").value.trim(), minor = q("minor").checked, foreign = q("nat").value === "Foreign";
      if (!name) return fail("Please add the name of guest " + (i + 1) + ".");
      ["name", "nat", "country", "passport", "visa", "visaExp", "arrIndia", "nextDest"].forEach(function (k) { body.append("g" + i + "_" + k, q(k).value.trim()); });
      body.append("g" + i + "_minor", minor ? "yes" : "");
      var files = foreign ? [["pp", "Passport"], ["vp", "Visa"]] : [["front", "Aadhaar front"], ["back", "Aadhaar back"]];
      if (!minor) {
        if (foreign && (!q("passport").value.trim() || !q("visa").value.trim())) return fail("Please add passport and visa numbers for guest " + (i + 1) + ".");
        for (var j = 0; j < files.length; j++) if (!q(files[j][0]).files[0]) return fail("Please add the " + files[j][1] + " photo for guest " + (i + 1) + ".");
      }
      files.forEach(function (fl) {
        (function (key, file) { jobs.push(shrink(file).then(function (b64) { if (b64) body.append(key, b64); })); })("g" + i + "_" + fl[0], q(fl[0]).files[0]);
      });
    }
    go.disabled = true; go.textContent = "Uploading...";
    Promise.all(jobs).then(function () {
      return fetch(ENDPOINT, { method: "POST", body: body }).then(function (r) { return r.json(); });
    }).then(function (res) {
      if (!res || !res.ok) throw new Error("x");
      f.hidden = true; var ok = document.getElementById("ok");
      ok.textContent = "Thank you, " + v("bookingName") + "! Your check-in is done. We'll see you on " + v("checkIn") + ". Check-in is from 1 pm.";
      ok.hidden = false; window.scrollTo(0, 0);
    }).catch(function () { fail("Something went wrong while uploading. Please try again, or send the IDs on WhatsApp to +91 80880 03883."); });
  });
</script>
</body>
</html>
